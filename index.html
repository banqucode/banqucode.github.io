<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>banquCode Apps</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(180deg, #dff1ff, #f3e8ff, #ffeef7);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: #ffffffdd;
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.6);
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
      margin: 0;
      margin-bottom: 6px;
      color: #444;
    }

    p {
      margin: 0;
      margin-bottom: 30px;
      color: #666;
      font-size: 15px;
    }

    .link-box {
      margin-bottom: 22px;
    }

    .link {
      display: block;
      width: 100%;
      background: #5aa8ff;
      color: white;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 12px rgba(90, 168, 255, 0.25);
      box-sizing: border-box;
    }

    .link:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    .description {
      margin-top: 6px;
      font-size: 14px;
      color: #555;
      opacity: 0.9;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }
      .logo {
        width: 100px;
        height: 100px;
      }
      .link {
        font-size: 15px;
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="logo.png" alt="Logo banquCode" class="logo">

    <h1>banquCode Apps</h1>
    <p>Desarrollador indie de apps minimalistas</p>

    <div class="link-box">
      <a class="link" href="https://tu-enlace-1.com">Recordables App</a>
      <div class="description">Tu diario minimalista, sin conexión y sin distracciones.</div>
    </div>

    <footer>Made with love by Banqucode</footer>
  </div>

</body>
</html>
