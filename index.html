<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banquCode Apps — Indie Software</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon-banqucode.svg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Configuración de color Brand alineada con TwelReserve -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 selection:bg-brand-500 selection:text-white relative overflow-x-hidden">

    <!-- Fondo con gradiente sutil y resplandor en tonos claros -->
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-brand-100/50 via-slate-50 to-slate-100 -z-10"></div>

    <main class="w-full max-w-md mx-auto my-auto py-8">
        <!-- Tarjeta Principal -->
        <div class="bg-white/90 backdrop-blur-xl p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-2xl shadow-slate-300/50 text-center relative">
            
            <!-- Badge Superior -->
            <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold bg-brand-50 text-brand-700 border border-brand-200 mb-6">
                <span class="w-2 h-2 rounded-full bg-brand-600 animate-pulse"></span>
                Indie Software Studio
            </span>

            <!-- Avatar con borde brillante -->
            <div class="relative w-24 h-24 mx-auto mb-5">
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-500 to-indigo-500 rounded-full blur opacity-40"></div>
                <img src="img/logo.png" alt="banquCode Apps" class="relative w-24 h-24 rounded-full object-cover border-2 border-white bg-slate-100 shadow-xl">
            </div>

            <!-- Título y Descripción -->
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-2">banquCode Apps</h1>
            <p class="text-slate-600 text-sm leading-relaxed mb-8">
                Desarrollo de aplicaciones web y micro-SaaS diseñados para resolver problemas reales de forma simple y eficiente.
            </p>

            <!-- Sección de Aplicaciones / Enlaces -->
            <div class="space-y-4">
                
                <!-- Tarjeta Destacada: TwelReserve -->
                <a href="twelreserve_landing.html" target="_blank" class="group block bg-slate-50 hover:bg-white border border-slate-200 hover:border-brand-500/50 rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-brand-500/10 text-left">
                    
                    <!-- Previsualización opcional de la app -->
                    <div class="h-28 w-full bg-slate-100 overflow-hidden relative border-b border-slate-200">
                        <img src="img/twelreserve-preview.png" alt="TwelReserve App" class="w-full h-full object-cover object-top group-hover:scale-105 transition duration-500 opacity-90 group-hover:opacity-100">
                        <div class="absolute top-3 right-3 bg-brand-600 text-white text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-md shadow-md tracking-wider">
                            Destacado
                        </div>
                    </div>

                    <!-- Detalles del enlace -->
                    <div class="p-4 sm:p-5 flex items-center justify-between gap-3">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h2 class="font-bold text-slate-900 text-base group-hover:text-brand-600 transition">TwelReserve</h2>
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400 group-hover:text-brand-600 transition"></i>
                            </div>
                            <p class="text-slate-600 text-xs leading-relaxed line-clamp-2">
                                La agenda minimalista para negocios de un solo profesional.
                            </p>
                        </div>
                        <div class="w-8 h-8 rounded-xl bg-brand-50 text-brand-600 border border-brand-100 flex items-center justify-center shrink-0 group-hover:bg-brand-600 group-hover:text-white transition">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </div>
                    </div>
                </a>

                <!-- Espacio preparado para futuras apps o redes -->
                <!--<div class="pt-2 flex justify-center gap-3 text-slate-500">
                    <a href="https://github.com" target="_blank" class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-center hover:text-slate-900 hover:border-slate-300 transition">
                        <i class="fa-brands fa-github text-base"></i>
                    </a>
                    <a href="https://x.com" target="_blank" class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-center hover:text-slate-900 hover:border-slate-300 transition">
                        <i class="fa-brands fa-x-twitter text-base"></i>
                    </a>
                </div>-->

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold">
            &copy; 2026 banquCode — Indie Software
        </p>
    </footer>

</body>
</html>
