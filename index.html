<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>banquCode Apps</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      background: #1f1f1f;
      color: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: #2a2a2a;
      padding: 40px 32px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      border: 1px solid #3a3a3a;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      margin: 0;
      margin-bottom: 8px;
      font-weight: 700;
      color: #fff;
    }

    p {
      margin: 0;
      margin-bottom: 28px;
      color: #cfcfcf;
      font-size: 15px;
    }

    .link-box {
      margin-bottom: 26px;
      text-align: left;
    }

    .link {
      display: block;
      width: 100%;
      background: #2563eb;
      color: white;
      padding: 14px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.15s ease;
    }

    .link:hover {
      background: #1e4fc7;
    }

    .description {
      margin-top: 8px;
      font-size: 14px;
      color: #cfcfcf;
      opacity: 0.9;
    }

    .privacy-link {
      margin-top: 10px;
      font-size: 13px;
    }

    .privacy-link a {
      color: #9ea3aa;
      text-decoration: none;
      font-weight: 500;
    }

    .privacy-link a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }
      .logo {
        width: 90px;
        height: 90px;
      }
      .link {
        font-size: 14px;
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="logo.png" alt="Logo banquCode" class="logo">

    <h1>banquCode Apps</h1>
    <p>Indie developer de apps minimalistas y enfocadas en la experiencia.</p>

    <div class="link-box">
      <a class="link" href="https://tu-enlace-1.com">TwelReserve — Gestión de citas para profesionales independientes</a>
      <div class="description">Gestión de citas enfocadas en negocios con un solo profesional</div>

      <!-- <div class="privacy-link">
        <a href="recordablesapp-privacy.html">Política de privacidad</a>
      </div> -->
    </div>

    <!-- <div class="link-box">
      <a class="link" href="https://tu-enlace-1.com">Recordables App</a>
      <div class="description">Diario minimalista, offline y sin distracciones.</div>

      <div class="privacy-link">
        <a href="recordablesapp-privacy.html">Política de privacidad</a>
      </div>
    </div> -->

    <footer>banquCode — Indie Software</footer>
  </div>

</body>
</html>
